name: vampi-lab

services:
  vampi:
    image: erev0s/vampi:latest
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8447:443"
      - "127.0.0.1:8086:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../certs:/etc/nginx/certs:ro
    depends_on:
      - vampi
    restart: unless-stopped
