{% extends "base.html" %}
{% block title %}Notices — eServices{% endblock %}
{% block content %}
<header class="page-head">
  <h1>Notices</h1>
  <p class="muted">Dated announcements for the demonstration portal. All notices are fictional.</p>
</header>

<section aria-label="Notice list" class="grid">
  {% for n in notices %}
  <article class="card">
    <time datetime="{{ n.date }}" class="muted">{{ n.date }}</time>
    <h2 style="margin:6px 0 8px; font-size:1.2rem;">{{ n.title }}</h2>
    <p><strong>{{ n.summary }}</strong></p>
    <p class="muted" style="margin-bottom:0;">{{ n.body }}</p>
  </article>
  {% endfor %}
</section>
{% endblock %}
